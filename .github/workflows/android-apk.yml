# Builds an installable Android APK on GitHub's servers — no Android Studio needed.
# GitHub → Actions → "Android APK" → Run workflow → enter your server URL → download the artifact.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Oyun sunucusu adresi (https://...)'
        required: true
        default: 'https://blockops-server.onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: node scripts/build-mobile.js --server "${{ github.event.inputs.server_url }}"

      - name: Add Android platform
        run: npx cap add android

      - name: Landscape + fullscreen + app icon
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $MANIFEST
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            for name in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp public/icons/icon-$size.png android/app/src/main/res/mipmap-$dir/$name.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Sync & build debug APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BlockOps-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

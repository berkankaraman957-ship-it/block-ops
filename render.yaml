# Render.com one-click deploy: New → Blueprint → select this repo.
services:
  - type: web
    name: blockops-server
    runtime: node
    plan: free
    region: frankfurt   # closest Render region to Türkiye (~40-60 ms instead of ~200 ms)
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
